openapi: 3.1.0
info:
  title: Invoyis API
  version: 0.1.0
  description: |
    Browser clients use same-origin /api routes. Go owns validation, sessions,
    authorization, and domain decisions. Calendar dates use YYYY-MM-DD;
    timestamps use RFC 3339 UTC. Money uses exact decimal strings.
servers:
  - url: /
paths:
  /api/v1/auth/code/request:
    post:
      operationId: requestAuthCode
      summary: Request a sign-in code
      description: Always returns neutral 202 for valid eligible and ineligible email addresses. Requires matching browser Origin and X-Invoyis-Intent header.
      parameters:
        - $ref: '#/components/parameters/BrowserIntent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCodeRequest'
      responses:
        '202':
          description: Request accepted without disclosing account eligibility.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
  /api/v1/auth/code/verify:
    post:
      operationId: verifyAuthCode
      summary: Verify a six-digit code and create a session
      description: The session token is only returned in a Secure, HttpOnly, host-only cookie.
      parameters:
        - $ref: '#/components/parameters/BrowserIntent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCodeVerify'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
  /api/v1/auth/session:
    get:
      operationId: getAuthSession
      summary: Restore an active session
      responses:
        '200':
          description: Active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
  /api/v1/auth/logout:
    post:
      operationId: logoutAuthSession
      summary: Revoke the current session and clear its cookie
      parameters:
        - $ref: '#/components/parameters/BrowserIntent'
      responses:
        '204':
          description: Session revoked or already absent.
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Check API health
      description: The Next.js route forwards to the Go /healthz liveness endpoint.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: API is healthy.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
components:
  parameters:
    BrowserIntent:
      name: X-Invoyis-Intent
      in: header
      required: true
      schema:
        type: string
        const: browser
      description: Explicit browser mutation intent; Go also verifies the Origin header.
    RequestId:
      name: X-Request-ID
      in: header
      description: The same-origin gateway creates a UUID for each request.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: Opaque continuation token. Clients must not parse or construct it.
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      description: Maximum items per page. Future list operations must define a stable sort with a unique tie-breaker.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  headers:
    RequestId:
      description: Request ID shared by the gateway, Go logs, and client.
      schema:
        type: string
        format: uuid
  responses:
    ValidationProblem:
      description: Invalid request or code.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimitProblem:
      description: Retry after the indicated seconds.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnauthorizedProblem:
      description: Missing, expired, or revoked session.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ForbiddenProblem:
      description: Browser origin or mutation intent rejected.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadGateway:
      description: Go is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GatewayTimeout:
      description: Go did not respond before the gateway deadline.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    AuthCodeRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    AuthCodeVerify:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          pattern: '^[0-9]{6}$'
    AcceptedResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: accepted }
    AuthSession:
      type: object
      additionalProperties: false
      required: [email, expiresAt]
      properties:
        email: { type: string, format: email }
        expiresAt: { $ref: '#/components/schemas/UtcTimestamp' }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ProblemCode:
      type: string
      description: Stable machine code. The web app selects localized copy from this value.
      enum: [UNAUTHORIZED, FORBIDDEN, VALIDATION_ERROR, INVALID_CODE, EXPIRED_CODE, RATE_LIMITED, UPSTREAM_UNAVAILABLE, UPSTREAM_TIMEOUT, INTERNAL_ERROR]
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
          description: JSON field path.
        code:
          type: string
          description: Stable field-level machine code.
    Problem:
      type: object
      description: RFC 9457 problem details. Clients display localized text based on code, not detail.
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ProblemCode'
        requestId:
          type: string
          format: uuid
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    Currency:
      type: string
      enum: [ILS, EUR]
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^-?(0|[1-9][0-9]*)\.[0-9]{2}$'
          not:
            const: '-0.00'
          description: Exact two-place decimal string; zero is "0.00".
          examples: ['125.40', '0.00']
        currency:
          $ref: '#/components/schemas/Currency'
    TaxAmount:
      description: Omitted tax is null; explicit zero is a Money object with amount "0.00".
      oneOf:
        - $ref: '#/components/schemas/Money'
        - type: 'null'
    CalendarDate:
      type: string
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      description: Calendar date in YYYY-MM-DD.
    UtcTimestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp normalized to UTC, ending in Z.
      pattern: 'Z$'
    CursorPage:
      type: object
      description: Future list operations specialize items and document their stable sort with a unique tie-breaker.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            type: object
        nextCursor:
          type: [string, 'null']
          description: Opaque token or null after the final page.
