openapi: 3.1.0
info:
  title: Invoyis API
  version: 0.1.0
  description: |
    Browser clients use same-origin /api routes. Go owns validation, sessions,
    authorization, and domain decisions. Calendar dates use YYYY-MM-DD;
    timestamps use RFC 3339 UTC. Money uses exact decimal strings.
servers:
  - url: /
paths:
  /api/v1/archives/{archiveId}/organisation/{kind}:
    parameters: [ { $ref: '#/components/parameters/ArchiveId' }, { $ref: '#/components/parameters/OrganisationKind' } ]
    get:
      operationId: listOrganisation
      parameters: [ { name: includeArchived, in: query, schema: { type: boolean, default: false }, description: Admin only when true. } ]
      responses:
        '200': { description: Active records by default, content: { application/json: { schema: { $ref: '#/components/schemas/OrganisationList' } } } }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
    post:
      operationId: createOrganisation
      parameters: [ { $ref: '#/components/parameters/BrowserIntent' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrganisationName' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/OrganisationRecord' } } } }
        '200': { description: Active identity replay; stored display name is returned, content: { application/json: { schema: { $ref: '#/components/schemas/OrganisationRecord' } } } }
        '409': { description: Archived identity or supplier alias reservation; authorised same-archive record ID and archived state are included, content: { application/problem+json: { schema: { $ref: '#/components/schemas/OrganisationConflict' } } } }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /api/v1/archives/{archiveId}/organisation/{kind}/{id}:
    parameters: [ { $ref: '#/components/parameters/ArchiveId' }, { $ref: '#/components/parameters/OrganisationKind' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      operationId: getOrganisation
      responses:
        '200': { description: Historical record, including archived, content: { application/json: { schema: { $ref: '#/components/schemas/OrganisationRecord' } } } }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
    patch:
      operationId: renameOrganisation
      parameters: [ { $ref: '#/components/parameters/BrowserIntent' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrganisationName' } } } }
      responses:
        '200': { description: Renamed or unchanged, content: { application/json: { schema: { $ref: '#/components/schemas/OrganisationRecord' } } } }
        '409': { description: Identity reserved, content: { application/problem+json: { schema: { $ref: '#/components/schemas/OrganisationConflict' } } } }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /api/v1/archives/{archiveId}/organisation/{kind}/{id}/{operation}:
    parameters: [ { $ref: '#/components/parameters/ArchiveId' }, { $ref: '#/components/parameters/OrganisationKind' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: operation, in: path, required: true, schema: { type: string, enum: [archive, restore] } }, { $ref: '#/components/parameters/BrowserIntent' } ]
    post:
      operationId: changeOrganisationArchiveState
      responses:
        '200': { description: Archived or restored record, content: { application/json: { schema: { $ref: '#/components/schemas/OrganisationRecord' } } } }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /api/v1/archives/{archiveId}/supplier-suggestions:
    parameters: [ { $ref: '#/components/parameters/ArchiveId' } ]
    get:
      operationId: suggestSuppliers
      parameters: [ { name: name, in: query, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Active suppliers deduplicated with strongest match, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/SupplierSuggestion' } } } } } } }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /api/v1/archives/{archiveId}/suppliers/{id}/aliases:
    parameters: [ { $ref: '#/components/parameters/ArchiveId' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      operationId: confirmSupplierAlias
      parameters: [ { $ref: '#/components/parameters/BrowserIntent' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } } }
      responses:
        '200': { description: Confirmed or existing on the same supplier, content: { application/json: { schema: { type: object, properties: { created: { type: boolean } } } } } }
        '409': { description: Key reserved by another supplier, content: { application/problem+json: { schema: { $ref: '#/components/schemas/OrganisationConflict' } } } }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /api/v1/archives/{archiveId}/supplier-aliases/reassign:
    parameters: [ { $ref: '#/components/parameters/ArchiveId' } ]
    post:
      operationId: reassignSupplierAlias
      parameters: [ { $ref: '#/components/parameters/BrowserIntent' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, expectedSupplierId, targetSupplierId], properties: { name: { type: string }, expectedSupplierId: { type: string, format: uuid }, targetSupplierId: { type: string, format: uuid } } } } } }
      responses:
        '200': { description: Alias reassigned, content: { application/json: { schema: { type: object, properties: { reassigned: { type: boolean } } } } } }
        '409': { description: Stale association, canonical key, or archived target, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /api/v1/archives:
    get:
      operationId: listArchives
      summary: List current archive memberships ordered by archive creation and ID.
      responses:
        '200': { description: Memberships, content: { application/json: { schema: { $ref: '#/components/schemas/ArchiveList' } } } }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
    post:
      operationId: createArchive
      summary: Create an archive and its initial admin membership.
      parameters: [ { $ref: '#/components/parameters/BrowserIntent' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateArchive' } } } }
      responses:
        '201': { description: Created archive, content: { application/json: { schema: { $ref: '#/components/schemas/Archive' } } } }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /api/v1/archives/{archiveId}:
    parameters: [ { $ref: '#/components/parameters/ArchiveId' } ]
    get:
      operationId: getArchive
      responses:
        '200': { description: Archive, content: { application/json: { schema: { $ref: '#/components/schemas/Archive' } } } }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
    patch:
      operationId: updateArchive
      parameters: [ { $ref: '#/components/parameters/BrowserIntent' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateArchive' } } } }
      responses:
        '200': { description: Updated archive, content: { application/json: { schema: { $ref: '#/components/schemas/Archive' } } } }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
  /api/v1/archives/{archiveId}/upload-sessions:
    parameters: [ { $ref: '#/components/parameters/ArchiveId' } ]
    post:
      operationId: createUploadSession
      summary: Bind a single PDF claim and obtain a direct private staging grant.
      parameters: [ { $ref: '#/components/parameters/BrowserIntent' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateUploadSession' } } } }
      responses:
        '201': { description: Upload session and write-only storage grant, content: { application/json: { schema: { $ref: '#/components/schemas/UploadSession' } } } }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /api/v1/archives/{archiveId}/upload-sessions/{id}/complete:
    parameters: [ { $ref: '#/components/parameters/ArchiveId' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      operationId: completeUploadSession
      summary: Verify staged bytes and return a durable receipt; safe to retry.
      parameters: [ { $ref: '#/components/parameters/BrowserIntent' } ]
      responses:
        '200': { description: Original preserved and receipt committed, content: { application/json: { schema: { $ref: '#/components/schemas/UploadReceipt' } } } }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409':
          description: Session conflict, or the authorised active session's staged object is confirmed missing (`UPLOAD_STAGED_OBJECT_MISSING`). Only the latter permits resending bytes.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /api/v1/archives/{archiveId}/documents:
    parameters: [ { $ref: '#/components/parameters/ArchiveId' } ]
    get:
      operationId: listDocumentStatuses
      summary: List recent document processing statuses in this archive.
      responses:
        '200': { description: Recent document statuses, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentStatusList' } } } }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
  /api/v1/archives/{archiveId}/documents/{id}/status:
    parameters: [ { $ref: '#/components/parameters/ArchiveId' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      operationId: getDocumentStatus
      summary: Read one document's safe processing status.
      responses:
        '200': { description: Processing status, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentStatus' } } } }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
  /api/v1/archives/{archiveId}/documents/{id}/review:
    parameters: [ { $ref: '#/components/parameters/ArchiveId' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      operationId: getDocumentReview
      summary: Read a cleared document's pinned candidates and human revision history.
      responses:
        '200': { description: Review state, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewState' } } } }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
    put:
      operationId: writeDocumentReview
      summary: Append a draft or confirmed metadata revision.
      parameters: [ { $ref: '#/components/parameters/BrowserIntent' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewWrite' } } } }
      responses:
        '200': { description: Saved review receipt, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewState' } } } }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { description: Version conflict with latest saved state, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewConflict' } } } }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /api/v1/archives/{archiveId}/documents/{id}/preview/{page}:
    parameters: [ { $ref: '#/components/parameters/ArchiveId' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: page, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 10 } } ]
    get:
      operationId: getDocumentPreviewPage
      summary: Authorised, re-encoded private PDF page raster.
      responses:
        '200':
          description: Derived PNG image.
          headers:
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
            X-Preview-Page-Cap: { schema: { type: integer, const: 10 } }
            X-Preview-Page-Count: { schema: { type: integer, minimum: 1 } }
          content: { image/png: { schema: { type: string, format: binary } } }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
  /api/v1/archives/{archiveId}/documents/{id}/original:
    parameters: [ { $ref: '#/components/parameters/ArchiveId' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      operationId: downloadDocumentOriginal
      summary: Download a cleared Needs review or Ready immutable original.
      responses:
        '200':
          description: Byte-identical PDF attachment.
          headers:
            Content-Disposition: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content: { application/pdf: { schema: { type: string, format: binary } } }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
  /api/v1/archives/{archiveId}/exports:
    parameters: [ { $ref: '#/components/parameters/ArchiveId' } ]
    post:
      operationId: createArchiveExport
      summary: Build a private 15-minute bundle of at most 20 Ready, cleared originals and 100 MiB of source PDFs.
      parameters: [ { $ref: '#/components/parameters/BrowserIntent' } ]
      responses:
        '201': { description: Complete bundle ready for delivery, content: { application/json: { schema: { $ref: '#/components/schemas/ExportReceipt' } } } }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /api/v1/archives/{archiveId}/exports/{id}:
    parameters: [ { $ref: '#/components/parameters/ArchiveId' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      operationId: downloadArchiveExport
      summary: Recheck membership, bulk grant, expiry and included document clearance before ZIP delivery.
      responses:
        '200':
          description: Private ZIP with exact originals, index.csv, and sha256.csv.
          headers:
            Content-Disposition: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content: { application/zip: { schema: { type: string, format: binary } } }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
  /api/v1/archives/{archiveId}/members:
    parameters: [ { $ref: '#/components/parameters/ArchiveId' } ]
    get:
      operationId: listArchiveMembers
      responses:
        '200': { description: Members ordered by joined time and account ID, content: { application/json: { schema: { $ref: '#/components/schemas/MemberList' } } } }
  /api/v1/archives/{archiveId}/members/{accountId}:
    parameters: [ { $ref: '#/components/parameters/ArchiveId' }, { $ref: '#/components/parameters/AccountId' } ]
    patch:
      operationId: changeArchiveMember
      parameters: [ { $ref: '#/components/parameters/BrowserIntent' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChangeMember' } } } }
      responses:
        '200': { description: Changed member, content: { application/json: { schema: { $ref: '#/components/schemas/ChangedMember' } } } }
        '409': { $ref: '#/components/responses/ConflictProblem' }
    delete:
      operationId: removeArchiveMember
      parameters: [ { $ref: '#/components/parameters/BrowserIntent' } ]
      responses:
        '204': { description: Member removed. }
        '409': { $ref: '#/components/responses/ConflictProblem' }
  /api/v1/archives/{archiveId}/invitations:
    parameters: [ { $ref: '#/components/parameters/ArchiveId' } ]
    get:
      operationId: listArchiveInvitations
      responses:
        '200': { description: Invitations ordered by expiry and ID, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationList' } } } }
    post:
      operationId: createArchiveInvitation
      parameters: [ { $ref: '#/components/parameters/BrowserIntent' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateInvitation' } } } }
      responses:
        '201': { description: Invitation queued for delivery, content: { application/json: { schema: { $ref: '#/components/schemas/Invitation' } } } }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
  /api/v1/archives/{archiveId}/invitations/{invitationId}:
    parameters: [ { $ref: '#/components/parameters/ArchiveId' }, { $ref: '#/components/parameters/InvitationId' } ]
    delete:
      operationId: revokeArchiveInvitation
      parameters: [ { $ref: '#/components/parameters/BrowserIntent' } ]
      responses:
        '204': { description: Invitation revoked. }
  /api/v1/invitations/accept:
    post:
      operationId: acceptArchiveInvitation
      parameters: [ { $ref: '#/components/parameters/BrowserIntent' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AcceptInvitation' } } } }
      responses:
        '200': { description: Membership created, content: { application/json: { schema: { $ref: '#/components/schemas/Archive' } } } }
        '409': { $ref: '#/components/responses/ConflictProblem' }
  /api/v1/account/language:
    get:
      operationId: getAccountLanguage
      responses:
        '200': { description: Account interface language, content: { application/json: { schema: { $ref: '#/components/schemas/AccountLanguage' } } } }
    put:
      operationId: setAccountLanguage
      parameters: [ { $ref: '#/components/parameters/BrowserIntent' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AccountLanguage' } } } }
      responses:
        '200': { description: Updated language, content: { application/json: { schema: { $ref: '#/components/schemas/AccountLanguage' } } } }
  /api/v1/auth/code/request:
    post:
      operationId: requestAuthCode
      summary: Request a sign-in code
      description: Always returns neutral 202 for valid eligible and ineligible email addresses. Requires matching browser Origin and X-Invoyis-Intent header.
      parameters:
        - $ref: '#/components/parameters/BrowserIntent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCodeRequest'
      responses:
        '202':
          description: Request accepted without disclosing account eligibility.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
  /api/v1/auth/code/verify:
    post:
      operationId: verifyAuthCode
      summary: Verify a six-digit code and create a session
      description: The session token is only returned in a Secure, HttpOnly, host-only cookie.
      parameters:
        - $ref: '#/components/parameters/BrowserIntent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCodeVerify'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
  /api/v1/auth/session:
    get:
      operationId: getAuthSession
      summary: Restore an active session
      responses:
        '200':
          description: Active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
  /api/v1/auth/logout:
    post:
      operationId: logoutAuthSession
      summary: Revoke the current session and clear its cookie
      parameters:
        - $ref: '#/components/parameters/BrowserIntent'
      responses:
        '204':
          description: Session revoked or already absent.
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Check API health
      description: The Next.js route forwards to the Go /healthz liveness endpoint.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: API is healthy.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
components:
  parameters:
    OrganisationKind: { name: kind, in: path, required: true, schema: { type: string, enum: [suppliers, categories, properties, paper-locations] } }
    ArchiveId: { name: archiveId, in: path, required: true, schema: { type: string, format: uuid } }
    AccountId: { name: accountId, in: path, required: true, schema: { type: integer, format: int64 } }
    InvitationId: { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
    BrowserIntent:
      name: X-Invoyis-Intent
      in: header
      required: true
      schema:
        type: string
        const: browser
      description: Explicit browser mutation intent; Go also verifies the Origin header.
    RequestId:
      name: X-Request-ID
      in: header
      description: The same-origin gateway creates a UUID for each request.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: Opaque continuation token. Clients must not parse or construct it.
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      description: Maximum items per page. Future list operations must define a stable sort with a unique tie-breaker.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  headers:
    RequestId:
      description: Request ID shared by the gateway, Go logs, and client.
      schema:
        type: string
        format: uuid
  responses:
    NotFoundProblem: { description: Archive-scoped resource unavailable, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    ConflictProblem: { description: Invitation or last-admin conflict, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    ValidationProblem:
      description: Invalid request or code.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimitProblem:
      description: Retry after the indicated seconds.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnauthorizedProblem:
      description: Missing, expired, or revoked session.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ForbiddenProblem:
      description: Browser origin or mutation intent rejected.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadGateway:
      description: Go is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GatewayTimeout:
      description: Go did not respond before the gateway deadline.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    OrganisationName: { type: object, required: [displayName], properties: { displayName: { type: string } } }
    OrganisationRecord: { type: object, required: [id, displayName, archived], properties: { id: { type: string, format: uuid }, displayName: { type: string }, archived: { type: boolean } } }
    OrganisationList: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/OrganisationRecord' } } } }
    SupplierSuggestion: { allOf: [ { $ref: '#/components/schemas/OrganisationRecord' }, { type: object, required: [match], properties: { match: { type: string, enum: [exact, broad] } } } ] }
    OrganisationConflict: { type: object, required: [type, title, status, code, requestId], properties: { type: { type: string }, title: { type: string }, status: { type: integer, const: 409 }, code: { type: string, const: IDENTITY_RESERVED }, requestId: { type: string }, recordId: { type: string, format: uuid }, archived: { type: boolean } } }
    CreateUploadSession:
      type: object
      additionalProperties: false
      required: [idempotencyKey, filename, mediaType, byteCount, sha256]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
        filename: { type: string, minLength: 1, maxLength: 255 }
        mediaType: { type: string, const: application/pdf }
        byteCount: { type: integer, minimum: 1, description: 'Server-enforced configurable cap; default 25 MiB.' }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    UploadGrant:
      type: object
      required: [method, url, headers, fields, expiresAt]
      properties:
        method: { type: string, enum: [PUT, POST] }
        url: { type: string, format: uri }
        headers: { type: object, additionalProperties: { type: string } }
        fields: { type: object, additionalProperties: { type: string } }
        expiresAt: { $ref: '#/components/schemas/UtcTimestamp' }
    UploadSession:
      type: object
      required: [id, state, finaliseBy, grant]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [created, staged, finalising, complete, expired, failed] }
        finaliseBy: { $ref: '#/components/schemas/UtcTimestamp' }
        grant: { $ref: '#/components/schemas/UploadGrant' }
    UploadReceipt:
      type: object
      required: [id, submissionId, documentId, state, byteCount, sha256, receivedAt]
      properties:
        id: { type: string, format: uuid }
        submissionId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        state: { type: string, const: received }
        byteCount: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        receivedAt: { $ref: '#/components/schemas/UtcTimestamp' }
    ReviewDecimal: { type: string, pattern: '^-?[0-9]{1,16}(\.[0-9]{1,8})?$' }
    ReviewTaxLine:
      type: object
      required: [amount, currency]
      properties:
        amount: { $ref: '#/components/schemas/ReviewDecimal' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        provenance: { type: string, readOnly: true }
    ReviewMetadata:
      type: object
      description: |
        One field group applies per type. Invoice, bill and credit_note use the invoice group
        (supplier, invoiceId, accountReference, currency, subtotal, tax, total, taxLines).
        lease, court_correspondence and other use the document group (title, sender, reference,
        notes) plus issueDate as the document date. The server omits the other group from
        responses and rejects any non-empty or non-null value from the wrong group. An empty
        documentType is an undecided draft and may carry either group; it cannot be confirmed.
        A non-invoice document needs only a title and a type to be confirmed.
      required: [documentType]
      properties:
        documentType: { type: string, enum: ['', invoice, bill, credit_note, lease, court_correspondence, other] }
        supplier: { type: string }
        invoiceId: { type: string }
        accountReference: { type: string }
        issueDate: { type: string, description: 'YYYY-MM-DD civil date, or empty in a draft. The document date for non-invoice types.' }
        currency: { type: string }
        subtotal: { anyOf: [ { $ref: '#/components/schemas/ReviewDecimal' }, { type: 'null' } ] }
        tax: { anyOf: [ { $ref: '#/components/schemas/ReviewDecimal' }, { type: 'null' } ] }
        total: { anyOf: [ { $ref: '#/components/schemas/ReviewDecimal' }, { type: 'null' } ] }
        taxLines: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/ReviewTaxLine' } }
        title: { type: string, maxLength: 200, description: 'Required to confirm a non-invoice document.' }
        sender: { type: string, maxLength: 300, description: 'Sender or parties; for example a court name.' }
        reference: { type: string, maxLength: 100, description: 'Printed reference kept as text, including leading zeroes; for example a case number.' }
        notes: { type: string, maxLength: 2000, description: 'Free notes; for example a lease property address.' }
    ReviewRevision:
      type: object
      required: [id, kind, actorId, createdAt, sourceRunId, metadata, provenance, acknowledgedWarnings]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [draft, confirmed] }
        actorId: { type: integer, format: int64 }
        createdAt: { $ref: '#/components/schemas/UtcTimestamp' }
        sourceRunId: { type: [string, 'null'], format: uuid }
        metadata: { $ref: '#/components/schemas/ReviewMetadata' }
        provenance: { type: object, additionalProperties: { type: string, enum: [extracted, manual, corrected] } }
        acknowledgedWarnings: { type: array, items: { type: string } }
    ReviewState:
      type: object
      required: [documentId, state, reviewVersion, sourceRunId, candidates, candidateWarnings, confirmed, draft, history]
      properties:
        documentId: { type: string, format: uuid }
        state: { type: string, enum: [needs_review, ready] }
        reviewVersion: { type: integer, format: int64 }
        sourceRunId: { type: [string, 'null'], format: uuid }
        candidates: { $ref: '#/components/schemas/ReviewMetadata' }
        candidateWarnings: { type: array, items: { type: string } }
        confirmed: { anyOf: [ { $ref: '#/components/schemas/ReviewRevision' }, { type: 'null' } ] }
        draft: { anyOf: [ { $ref: '#/components/schemas/ReviewRevision' }, { type: 'null' } ] }
        history: { type: array, items: { $ref: '#/components/schemas/ReviewRevision' } }
    ReviewWrite:
      type: object
      required: [action, expectedVersion, idempotencyKey, sourceRunId, metadata, acknowledgedWarnings, inputLocale, rawAmounts]
      properties:
        action: { type: string, enum: [draft, confirm] }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        idempotencyKey: { type: string, format: uuid }
        sourceRunId: { type: [string, 'null'], format: uuid }
        metadata: { $ref: '#/components/schemas/ReviewMetadata' }
        acknowledgedWarnings: { type: array, items: { type: string } }
        inputLocale: { type: string, enum: [en, fr, he], description: 'Locale used for raw amount entry; supplied with rawAmounts.' }
        rawAmounts:
          type: object
          required: [subtotal, tax, total, taxLines]
          properties:
            subtotal: { type: [string, 'null'] }
            tax: { type: [string, 'null'] }
            total: { type: [string, 'null'] }
            taxLines: { type: array, items: { type: string } }
    ReviewConflict:
      type: object
      required: [code, latest]
      properties:
        code: { type: string, const: REVIEW_CONFLICT }
        latest: { $ref: '#/components/schemas/ReviewState' }
    DocumentStatus:
      type: object
      required: [id, status, originalFilename, confirmedType, confirmedTitle]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, processing, needs_review, ready, file_blocked, processing_failed] }
        originalFilename: { type: string }
        confirmedType: { type: [string, 'null'], enum: [invoice, bill, credit_note, lease, court_correspondence, other, null], description: 'From the confirmed revision only; a later draft does not change it.' }
        confirmedTitle: { type: [string, 'null'], description: 'Confirmed title of a non-invoice document; null for invoices.' }
    DocumentStatusList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DocumentStatus' } }
    ExportReceipt:
      type: object
      required: [id, expiresAt]
      properties:
        id: { type: string, format: uuid }
        expiresAt: { $ref: '#/components/schemas/UtcTimestamp' }
    ArchiveRole: { type: string, enum: [admin, contributor, viewer] }
    ArchiveKind: { type: string, enum: [personal, business] }
    InterfaceLanguage: { type: string, enum: [en, fr, he] }
    Archive:
      type: object
      required: [id, kind, name, jurisdiction, role, canBulkExport]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ArchiveKind' }
        name: { type: string }
        jurisdiction: { type: [string, 'null'], pattern: '^[A-Z]{2}$' }
        role: { $ref: '#/components/schemas/ArchiveRole' }
        canBulkExport: { type: boolean }
        uploadMaxBytes: { type: integer, minimum: 1, description: 'Current server-side single-file upload cap. Present on archive detail.' }
    ArchiveList: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Archive' } } } }
    CreateArchive: { type: object, required: [kind, name], properties: { kind: { $ref: '#/components/schemas/ArchiveKind' }, name: { type: string }, jurisdiction: { type: string, pattern: '^[A-Z]{2}$', description: Required for Business archives. } } }
    UpdateArchive: { type: object, required: [name, jurisdiction], properties: { name: { type: string }, jurisdiction: { type: string, pattern: '^([A-Z]{2})?$', description: Empty only for Personal archives. } } }
    Member: { type: object, required: [accountId, email, role, canBulkExport], properties: { accountId: { type: integer, format: int64 }, email: { type: string, format: email }, role: { $ref: '#/components/schemas/ArchiveRole' }, canBulkExport: { type: boolean } } }
    MemberList: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Member' } } } }
    ChangeMember: { type: object, required: [role, canBulkExport], properties: { role: { $ref: '#/components/schemas/ArchiveRole' }, canBulkExport: { type: boolean } } }
    ChangedMember: { type: object, required: [accountId, role, canBulkExport], properties: { accountId: { type: integer, format: int64 }, role: { $ref: '#/components/schemas/ArchiveRole' }, canBulkExport: { type: boolean } } }
    Invitation: { type: object, required: [id, archiveId, email, role, expiresAt, status], properties: { id: { type: string, format: uuid }, archiveId: { type: string, format: uuid }, email: { type: string, format: email }, role: { $ref: '#/components/schemas/ArchiveRole' }, expiresAt: { $ref: '#/components/schemas/UtcTimestamp' }, status: { type: string, enum: [active, expired, revoked, accepted] } } }
    InvitationList: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Invitation' } } } }
    CreateInvitation: { type: object, required: [email, role], properties: { email: { type: string, format: email }, role: { $ref: '#/components/schemas/ArchiveRole' } } }
    AcceptInvitation: { type: object, required: [token], properties: { token: { type: string, minLength: 43, maxLength: 43 } } }
    AccountLanguage: { type: object, required: [language], properties: { language: { $ref: '#/components/schemas/InterfaceLanguage' } } }
    AuthCodeRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        invitationToken:
          type: string
          minLength: 43
          maxLength: 43
          description: Required for a new email invited to an archive; ignored for eligible existing accounts.
    AuthCodeVerify:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          pattern: '^[0-9]{6}$'
        invitationToken:
          type: string
          minLength: 43
          maxLength: 43
          description: Must match the invitation bound to a new account's code challenge.
    AcceptedResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: accepted }
    AuthSession:
      type: object
      additionalProperties: false
      required: [email, expiresAt]
      properties:
        email: { type: string, format: email }
        expiresAt: { $ref: '#/components/schemas/UtcTimestamp' }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ProblemCode:
      type: string
      description: Stable machine code. The web app selects localized copy from this value.
      enum: [UNAUTHORIZED, FORBIDDEN, VALIDATION_ERROR, INVALID_CODE, EXPIRED_CODE, RATE_LIMITED, UPSTREAM_UNAVAILABLE, UPSTREAM_TIMEOUT, INTERNAL_ERROR, NOT_FOUND, CONFLICT, UPLOAD_STAGED_OBJECT_MISSING]
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
          description: JSON field path.
        code:
          type: string
          description: Stable field-level machine code.
    Problem:
      type: object
      description: RFC 9457 problem details. Clients display localized text based on code, not detail.
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ProblemCode'
        requestId:
          type: string
          format: uuid
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    Currency:
      type: string
      enum: [ILS, EUR]
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^-?(0|[1-9][0-9]*)\.[0-9]{2}$'
          not:
            const: '-0.00'
          description: Exact two-place decimal string; zero is "0.00".
          examples: ['125.40', '0.00']
        currency:
          $ref: '#/components/schemas/Currency'
    TaxAmount:
      description: Omitted tax is null; explicit zero is a Money object with amount "0.00".
      oneOf:
        - $ref: '#/components/schemas/Money'
        - type: 'null'
    CalendarDate:
      type: string
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      description: Calendar date in YYYY-MM-DD.
    UtcTimestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp normalized to UTC, ending in Z.
      pattern: 'Z$'
    CursorPage:
      type: object
      description: Future list operations specialize items and document their stable sort with a unique tie-breaker.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            type: object
        nextCursor:
          type: [string, 'null']
          description: Opaque token or null after the final page.
