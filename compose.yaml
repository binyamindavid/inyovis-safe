services:
  db:
    image: postgres:18
    profiles: [ci]
    environment:
      POSTGRES_DB: invoyis
      POSTGRES_USER: invoyis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U invoyis -d invoyis"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: migrate/migrate:v4.19.1
    profiles: [tools]
    volumes:
      - ./apps/backend/migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      # Keep the migration ledger in public even after the invoyis schema is created.
      - "${MIGRATE_DATABASE_URL:-}"

  storage:
    image: chrislusf/seaweedfs:4.53
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Run scripts/create-local-env.sh first}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Run scripts/create-local-env.sh first}
      S3_BUCKET: invoyis-originals
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - storage-data:/data

  mail:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  db-data:
  storage-data:
