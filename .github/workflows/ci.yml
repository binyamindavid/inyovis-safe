name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn check:generated
      - run: yarn workspace @invoyis/contracts test
      - run: yarn workspace @invoyis/web test
      - run: yarn build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/backend/go.mod
          cache: false
      - run: go build ./...
      - run: go test ./...
      - run: go vet ./...

  auth-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/backend/go.mod
          cache: false
      - name: Generate disposable database credentials
        run: |
          scripts/create-local-env.sh
          cat .env >> "$GITHUB_ENV"
          postgres_password="$(openssl rand -hex 24)"
          printf 'POSTGRES_PASSWORD=%s\n' "$postgres_password" >> "$GITHUB_ENV"
      - run: docker compose up -d --wait db
      - name: Create and migrate test database
        run: |
          docker compose exec -T db psql -X -U invoyis -d invoyis -v ON_ERROR_STOP=1 -c 'CREATE DATABASE invoyis_auth_test OWNER invoyis'
          MIGRATE_DATABASE_URL="postgres://invoyis:$POSTGRES_PASSWORD@db:5432/invoyis_auth_test?sslmode=disable&search_path=public" docker compose run --rm migrate up
      - name: Run PostgreSQL auth integration tests
        working-directory: apps/backend
        run: |
          TEST_DATABASE_URL="postgres://invoyis:$POSTGRES_PASSWORD@127.0.0.1:54329/invoyis_auth_test?sslmode=disable" go test -count=1 ./internal/auth
      - if: always()
        run: docker compose down --volumes

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate disposable service credentials
        run: |
          scripts/create-local-env.sh
          cat .env >> "$GITHUB_ENV"
          postgres_password="$(openssl rand -hex 24)"
          printf 'POSTGRES_PASSWORD=%s\n' "$postgres_password" >> "$GITHUB_ENV"
          printf 'MIGRATE_DATABASE_URL=postgres://invoyis:%s@db:5432/invoyis?sslmode=disable&search_path=public\n' "$postgres_password" >> "$GITHUB_ENV"
      - run: docker compose up -d --wait db storage mail
      - name: Apply migrations
        run: |
          docker compose run --rm migrate up
          docker compose run --rm migrate up
      - name: Roll back and reapply on the disposable database
        run: |
          docker compose run --rm migrate down -all
          result="$(docker compose exec -T db psql -X -U invoyis -d invoyis -v ON_ERROR_STOP=1 -Atc "SELECT to_regnamespace('invoyis') IS NULL")"
          test "$result" = t
          docker compose run --rm migrate up
      - name: Check the schema exists
        run: |
          result="$(docker compose exec -T db psql -X -U invoyis -d invoyis -v ON_ERROR_STOP=1 -Atc "SELECT to_regnamespace('invoyis')")"
          test "$result" = invoyis
      - name: Check the local bucket and mail inbox
        run: |
          bucket=http://127.0.0.1:8333/invoyis-originals
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 --max-time 3 \
            --aws-sigv4 aws:amz:us-east-1:s3 --user "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" "$bucket" >/dev/null
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$bucket")"
          test "$status" = 403
          curl --fail --silent --show-error http://127.0.0.1:8025/api/v1/messages >/dev/null
      - if: always()
        run: docker compose down --volumes

  archive-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/backend/go.mod
          cache: false
      - name: Generate disposable database credentials
        run: |
          scripts/create-local-env.sh
          cat .env >> "$GITHUB_ENV"
          printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          printf 'ARCHIVE_RUNTIME_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: docker compose up -d --wait db
      - name: Create and migrate archive test database
        run: |
          docker compose exec -T db psql -X -U invoyis -d invoyis -v ON_ERROR_STOP=1 -c 'CREATE DATABASE invoyis_archive_test OWNER invoyis'
          MIGRATE_DATABASE_URL="postgres://invoyis:$POSTGRES_PASSWORD@db:5432/invoyis_archive_test?sslmode=disable&search_path=public" docker compose run --rm migrate up
      - name: Provision restricted runtime role
        run: |
          ARCHIVE_PROVISION_DATABASE_URL="postgres://invoyis:$POSTGRES_PASSWORD@127.0.0.1:54329/invoyis_archive_test?sslmode=disable" scripts/provision-archive-runtime.sh
      - name: Test archive isolation with restricted role
        working-directory: apps/backend
        run: |
          ARCHIVE_TEST_DATABASE_URL="postgres://invoyis:$POSTGRES_PASSWORD@127.0.0.1:54329/invoyis_archive_test?sslmode=disable" \
          TEST_ARCHIVE_DATABASE_URL="postgres://invoyis_archive_runtime:$ARCHIVE_RUNTIME_PASSWORD@127.0.0.1:54329/invoyis_archive_test?sslmode=disable" \
          go test -count=1 ./internal/archive
      - if: always()
        run: docker compose down --volumes
